name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint the CI configuration itself; no Docker is needed here.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # downloading code to the runner
        uses: actions/checkout@v7

      # Official way to run actionlint: download script from rhysd/actionlint
      - name: Lint workflow files with actionlint # catches errors in CI config itself
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash

  # Static checks of Python code; PostgreSQL is not needed for Ruff.
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # downloading code to the runner
        uses: actions/checkout@v7

      - name: Copy env
        run: cp .env.example .env

      - name: Docker compose build
        run: docker compose build web

      - name: Run ruff linter # static checks of Python code (config in pyproject.toml)
        run: docker compose run --rm --no-deps web ruff check .

  # Django checks that need a prepared database.
  django-checks:
    name: Django checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # downloading code to the runner
        uses: actions/checkout@v7

      - name: Copy env
        run: cp .env.example .env

      - name: Docker compose config
        run: docker compose config

      - name: Docker compose build
        run: docker compose build web

      - name: Run Django system checks
        run: docker compose run --rm web python manage.py check

      - name: Check for missing migrations
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Run Django migrations
        run: docker compose run --rm web python manage.py migrate

  # Django test suite against PostgreSQL.
  django-tests:
    name: Django tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # downloading code to the runner
        uses: actions/checkout@v7

      - name: Copy env
        run: cp .env.example .env

      - name: Docker compose build
        run: docker compose build web

      - name: Run Django tests
        run: docker compose run --rm web python manage.py test
